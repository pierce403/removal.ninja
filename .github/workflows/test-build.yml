name: Test Build Environment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]
    
    name: Test Build on ${{ matrix.os }} with Node ${{ matrix.node-version }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Clean Install Dependencies
      run: |
        npm ci
        cd client && npm ci

    - name: Lint Check
      run: cd client && npm run lint
        
    - name: Type Check
      run: |
        cd client && npx tsc --noEmit

    - name: Unit Tests
      run: cd client && npm test
        
    - name: Test Build (Production)
      run: |
        cd client && npm run build
        
    - name: Verify Build Assets and Size
      run: node scripts/check-build.cjs client/build
        
  test-vite-dev-server:
    runs-on: ubuntu-latest
    name: Test Vite Development Server
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install Dependencies
      run: |
        npm ci
        cd client && npm ci
        
    - name: Test Development Build
      run: |
        cd client
        npm start > /tmp/removal-vite-dev.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for attempt in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:5173 | grep -q '/src/index.tsx'; then
            exit 0
          fi
          sleep 1
        done
        cat /tmp/removal-vite-dev.log
        exit 1
